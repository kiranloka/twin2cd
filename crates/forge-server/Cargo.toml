[package]
name = "forge-server"
description = "Forge control plane API server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "forge-server"
path = "src/main.rs"

[features]
default = []
otel = ["forge-observability/otel"]
postgres = ["forge-storage/postgres"]

[dependencies]
axum = { workspace = true }
forge-common = { workspace = true }
forge-core = { workspace = true }
forge-engine = { workspace = true }
forge-observability = { workspace = true }
forge-protocol = { workspace = true }
forge-storage = { workspace = true }
forge-secrets = { workspace = true }
forge-workflow = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tonic = { workspace = true }
tokio-stream = { workspace = true }
