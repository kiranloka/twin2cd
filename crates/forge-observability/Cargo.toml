[package]
name = "forge-observability"
description = "Tracing and optional OpenTelemetry exporters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
