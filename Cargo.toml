[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/forge-server", "crates/forge-runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bollard = { version = "0.18", default-features = false, features = ["pipe"] }
prost = "0.14"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "process", "fs", "io-util", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "macros", "migrate", "any", "sqlite"] }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
getrandom = "0.2"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }
tonic = { version = "0.14.9", features = ["transport"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.2"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

forge-actions = { path = "crates/forge-actions" }
forge-artifacts = { path = "crates/forge-artifacts" }
forge-common = { path = "crates/forge-common" }
forge-core = { path = "crates/forge-core" }
forge-engine = { path = "crates/forge-engine" }
forge-executor = { path = "crates/forge-executor" }
forge-observability = { path = "crates/forge-observability" }
forge-plugin-sdk = { path = "crates/forge-plugin-sdk" }
forge-protocol = { path = "crates/forge-protocol" }
forge-scheduler = { path = "crates/forge-scheduler" }
forge-secrets = { path = "crates/forge-secrets" }
forge-storage = { path = "crates/forge-storage" }
forge-workflow = { path = "crates/forge-workflow" }
