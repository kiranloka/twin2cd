services:
  forge-server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      FORGE_DATABASE_URL: sqlite:///data/forge.db?mode=rwc
      FORGE_ENV: production
      FORGE_DEV_API_TOKEN: ${FORGE_API_TOKEN:-}
    volumes:
      - forge-data:/data
    restart: unless-stopped

  forge-postgres:
    image: postgres:16-alpine
    profiles: [cloud]
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  forge-data:
  pg-data: